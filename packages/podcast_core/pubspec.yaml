name: podcast_core
description: "Jezgra aplikacije za AI-obrađene podcast epizode — dijele je DOMOVINA.ai i Podcasterium."
publish_to: 'none'
# Verzija paketa se označava git tagom (core-vX.Y.Z); pubspec verzija je
# informativna. Verziju APLIKACIJE i dalje nosi korijenski pubspec.yaml.
version: 0.1.0

environment:
  sdk: ^3.11.4

# Član pub workspacea korijenskog pubspec.yaml — jedan pubspec.lock, jedan
# `flutter pub get` u korijenu rješava i paket i ljusku.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # i18n (gen-l10n): app_hr.arb je template/izvorni jezik, app_en.arb prijevod.
  # intl verziju pinna flutter_localizations iz SDK-a; `any` izbjegava sukob.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  flutter_web_plugins:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  # Direktno radi custom inline syntaxa (person-needle highlight u članku);
  # verzija prati flutter_markdown-ov transitive constraint.
  markdown: ^7.3.1
  url_launcher: ^6.3.2
  go_router: ^14.8.1
  web: ^1.1.1
  shared_preferences: ^2.5.5
  fuzzy: ^0.5.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  audio_service: ^0.18.18
  path_provider: ^2.1.5
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  # SEPA/EPC QR za pinka.finance "Podrži ovu epizodu" panel. CustomPaint-based,
  # bez dart:html → siguran za --wasm build.
  qr_flutter: ^4.1.0
  # Passkeys: ovisimo direktno o platform paketima (NE o meta `passkeys`) jer
  # meta povlači `ua_client_hints` koji importa `dart:html` → ruši --wasm build.
  # Platform paketi ovise samo o platform_interface (+ package:web na webu).
  passkeys_platform_interface: ^2.6.0
  passkeys_web: ^2.8.1
  passkeys_android: ^2.12.0
  passkeys_ios: ^2.9.0
  purchases_flutter: ^10.3.0
  # Staggered zid podrške (pinka). Čisti Flutter layout paket (RenderObject),
  # bez dart:html → provjereno siguran za --wasm build (spike 8.8.2026.).
  flutter_staggered_grid_view: ^0.7.0
  floating: ^6.0.0
  # Native share sheet (iOS/Android/macOS) za dijeljenje EPUB e-knjige kao
  # DATOTEKE — WhatsApp, Mail, Files. Na webu se NE koristi: tamo ide vlastiti
  # `file_share_web.dart` nad `navigator.share` iz package:web (vidi
  # lib/services/file_share.dart). share_plus 13 ovisi o `web: ^1.1.1`, ne o
  # `dart:html`, pa ne ruši --wasm build (ista provjera kao za passkeys).
  share_plus: ^13.3.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Brand-neutralni asseti jezgre; učitavaju se s `package: 'podcast_core'`.
  # Brend asseti (logo, splash) NISU ovdje — daje ih ljuska kroz BrandConfig.
  assets:
    - assets/icons/google_g_logo.png
  # Generira AppLocalizations iz lib/l10n/*.arb (vidi l10n.yaml). Pokreni
  # `flutter gen-l10n` u OVOM direktoriju nakon promjene ARB-a; generirani
  # Dart je u gitu jer se paket gradi kao ovisnost ljuske.
  generate: true
