<!DOCTYPE html>
<!--
  DOMOVINA.ai — Google Cast Web Receiver (CAF v3).

  Televizor otvara ovu stranicu kad pošiljatelj (Android/iOS aplikacija, kasnije
  Chrome) pokrene sesiju s našim App ID-om. Pošiljatelj preda MediaInformation
  (URL medija na cdn.domovina.ai, titlovi kao VTT text track, metapodaci), a
  televizor sam povlači bajtove — ova stranica ne dohvaća ništa osim medija i
  slika koje joj pošiljatelj navede.

  Plaćeni sponzorski trenuci („Sponzorirano · {brand}", DSA čl. 26) stižu u
  MediaInformation.customData; ugovor je u docs/plans/2026-10-17-cast-na-tv.md
  („Ugovor customData"), a pošiljateljska strana u
  packages/podcast_core/lib/services/cast_receiver.dart. Mijenjaš li polje
  ovdje, mijenjaj ga i ondje (i povećaj `v`).

  Servira je web/_worker.js (handleCastReceiver) BEZ COOP/COEP — CAF ih ne
  treba, a gstatic skripta ionako šalje CORP cross-origin.

  Boje su AppBrand.config (domovina_brand.dart): seed #002F6C, accent #FF0000.
  Bez emojija (pravilo iz CLAUDE.md); oznaka dolazi od pošiljatelja već
  lokalizirana, s hrvatskim defaultom.
-->
<html lang="hr">
<head>
  <meta charset="utf-8">
  <title>DOMOVINA.ai</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root {
      --brand-navy: #002F6C;
      --brand-red: #FF0000;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--brand-navy);
      font-family: Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    cast-media-player {
      --theme-hue: 214;
      --progress-color: var(--brand-red);
      --splash-image: url('/icons/Icon-512.png');
      --splash-size: 192px;
      --logo-image: url('/icons/Icon-192.png');
      --logo-size: 72px;
      --background-image: none;
      --font-family: Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
      position: absolute;
      inset: 0;
    }
    /* Gore lijevo: dno zauzimaju titlovi i CAF-ova traka napretka. */
    #sponsored {
      position: fixed;
      top: 5vh;
      left: 5vw;
      max-width: 50vw;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.72);
      border-left: 6px solid #F2C14E; /* AppTheme.sponsoredAccent(dark), zlatna */
      color: #FFFFFF;
    }
    #sponsored.visible { display: flex; }
    #sponsored img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 8px;
      background: #FFFFFF;
    }
    #sponsored img[hidden] { display: none; }
    #sponsored .label {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
    }
    #sponsored .tagline {
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.3;
      opacity: 0.85;
    }
    #sponsored .tagline:empty { display: none; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <div id="sponsored" role="note" aria-live="polite">
    <img alt="" referrerpolicy="no-referrer" hidden>
    <div>
      <div class="label"></div>
      <div class="tagline"></div>
    </div>
  </div>
  <script>
    'use strict';

    // Verzija ugovora customData koju ovaj receiver zna čitati.
    var CUSTOM_DATA_VERSION = 1;
    var DEFAULT_SPONSORED_LABEL = 'Sponzorirano';

    function log(msg) {
      console.log('[DOMOVINA cast] ' + msg);
    }

    function nonEmpty(v) {
      if (typeof v !== 'string') return null;
      var t = v.trim();
      return t ? t : null;
    }

    function httpsUrl(v) {
      var s = nonEmpty(v);
      if (!s) return null;
      try {
        var u = new URL(s);
        return u.protocol === 'https:' && u.host ? s : null;
      } catch (e) {
        return null;
      }
    }

    // Isto pravilo kao SponsoredMoment.tryParse: bez imena branda ili bez
    // smislenog raspona trenutak se preskače — oznaka bez platitelja krši
    // DSA čl. 26, pa je bolje ništa.
    function parseMoments(customData) {
      if (!customData || typeof customData !== 'object') return [];
      if (customData.v !== CUSTOM_DATA_VERSION) {
        log('customData v=' + customData.v + ', očekujem ' + CUSTOM_DATA_VERSION + ' — trenutke preskačem');
        return [];
      }
      var rows = Array.isArray(customData.sponsored) ? customData.sponsored : [];
      var out = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i] || {};
        var brand = nonEmpty(r.brand);
        var start = typeof r.start === 'number' ? r.start : NaN;
        var end = typeof r.end === 'number' ? r.end : NaN;
        if (!brand || !(start >= 0) || !(end > start)) continue;
        out.push({
          start: start,
          end: end,
          brand: brand,
          tagline: nonEmpty(r.tagline),
          logo: httpsUrl(r.logo),
        });
      }
      out.sort(function (a, b) { return a.start - b.start; });
      return out;
    }

    var bar = document.getElementById('sponsored');
    var barLogo = bar.querySelector('img');
    var barLabel = bar.querySelector('.label');
    var barTagline = bar.querySelector('.tagline');

    var moments = [];
    var sponsoredLabel = DEFAULT_SPONSORED_LABEL;
    var shown = null;

    function applyCustomData(customData) {
      moments = parseMoments(customData);
      var labels = (customData && customData.labels) || {};
      sponsoredLabel = nonEmpty(labels.sponsored) || DEFAULT_SPONSORED_LABEL;
      shown = null;
      render(null);
      log('učitano sponzorskih trenutaka: ' + moments.length);
    }

    // Poluotvoren raspon [start, end), kao u ugovoru backend-a.
    function activeAt(seconds) {
      for (var i = 0; i < moments.length; i++) {
        var m = moments[i];
        if (seconds >= m.start && seconds < m.end) return m;
      }
      return null;
    }

    // Samo textContent — brand i tagline su korisnički unos, nikad HTML.
    function render(m) {
      if (!m) {
        bar.classList.remove('visible');
        return;
      }
      barLabel.textContent = sponsoredLabel + ' · ' + m.brand;
      barTagline.textContent = m.tagline || '';
      if (m.logo) {
        barLogo.src = m.logo;
        barLogo.hidden = false;
      } else {
        barLogo.removeAttribute('src');
        barLogo.hidden = true;
      }
      bar.classList.add('visible');
    }

    function onPosition(seconds) {
      if (typeof seconds !== 'number') return;
      var m = activeAt(seconds);
      if (m === shown) return;
      shown = m;
      render(m);
    }

    var context = cast.framework.CastReceiverContext.getInstance();
    var playerManager = context.getPlayerManager();
    var EventType = cast.framework.events.EventType;

    // customData se čita iz LOAD poruke: tada je sigurno vezan uz medij koji
    // upravo krene, a ne uz prethodni.
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      function (request) {
        applyCustomData(request && request.media ? request.media.customData : null);
        return request;
      }
    );

    playerManager.addEventListener(EventType.TIME_UPDATE, function (e) {
      onPosition(e.currentMediaTime);
    });
    playerManager.addEventListener(EventType.SEEKED, function (e) {
      onPosition(e.currentMediaTime);
    });
    playerManager.addEventListener(EventType.MEDIA_FINISHED, function () {
      applyCustomData(null);
    });

    // Titlovi čitljivi s kauča: bijeli tekst na poluprozirnoj crnoj podlozi.
    playerManager.addEventListener(EventType.PLAYER_LOAD_COMPLETE, function () {
      try {
        var style = new cast.framework.messages.TextTrackStyle();
        style.foregroundColor = '#FFFFFFFF';
        style.backgroundColor = '#000000B3';
        style.fontScale = 1.2;
        playerManager.getTextTracksManager().setTextTrackStyle(style);
      } catch (e) {
        log('stil titlova nije postavljen: ' + e);
      }
    });

    context.start();
    log('receiver pokrenut');
  </script>
</body>
</html>
